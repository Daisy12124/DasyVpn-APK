name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download libv2ray AAR
        run: |
          mkdir -p app/libs
          curl -L --retry 5 -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.10/libv2ray.aar"
          ls -la app/libs/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DasyVPN-1.0.0.apk
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DasyVPN-apk
          path: dist/DasyVPN-1.0.0.apk
          retention-days: 3

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: DASY VPN 1.0.0
          body: |
            اپ DASY VPN نسخه ۱.۰.۰ — فایل APK را دانلود و روی اندروید نصب کنید.
            (ساخته‌شده با GitHub Actions)
          files: dist/DasyVPN-1.0.0.apk
          make_latest: true
